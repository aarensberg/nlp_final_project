[project]
name = "nlp-final-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aarensberg", email = "sandro.arens@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
]

[project.scripts]
nlp-final-project = "nlp_final_project:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
